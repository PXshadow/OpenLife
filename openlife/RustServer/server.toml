# Open Life Reborn — server configuration
# Override path: `ol-server path/to/config.toml`

game_port = 8005
web_port = 8080
bind = "0.0.0.0"
max_players = 200
# Fallback if content/dataVersionNumber.txt missing. Live server prefers content version (e.g. 437).
required_version = 437
# When true, LOGIN with a numeric client_tag that mismatches required_version is hard-rejected
# (PS reject message + no player spawn). Default false = soft-log only.
client_version_strict = false
# Haxe lastVanillaID: highest vanilla object id. < 1 (default -1) = mapping off.
# last_vanilla_id = -1
# Haxe OpenLifeClientName: LOGIN client_tag substring that keeps raw OpenLife ids.
# open_life_client_name = "OpenLife"
content_path = "content/OneLifeData7"
challenge_len = 48
tick_hz = 20
# Time dilation: multiplies vitals dt (1.0 = realtime; 2.0 = 2x aging/food; 0 freezes).
sim_speed = 1.0
enable_game_net = true
enable_web = true

# Ticket auth (Haxe VerifyIfOholAccount). Default ON — set false for local/dev clients.
verify_ohol_ticket = false
ticket_verify_url = "https://onehouronelife.com/ticketServer/server.php"

# World: PNG biomes + natural spawn → versioned binary OLW1
map_png_path = "maps/mysteraV1Test.png"
save_directory = "SaveFiles"
generate_map_if_missing = true
force_regenerate_map = false
natural_object_density = 0.4

# Self-play agents (dev / viewer). OFF for human playtest — floods clients with AI traffic.
selfplay_enabled = false
selfplay_agents = 0
# Cap reverse craft-graph seed size (boot speed).
craft_graph_seed_cap = 50000

# Multi-server twin peers (listed in SAY ?TWINS; live-reloaded; pongs via TWINPONG / future sockets).
# twin_peers = [
#   { host = "127.0.0.1", port = 8006 },
# ]
twin_peers = []

# Timed multi-tile MovePath + PM (Haxe MoveHelper) — not instant teleports.
# Timed jump gate is always Haxe MaxMovementQuadJumpDistanceBeforeForce (quadDist ≤ 5).
# move_jump_max_chebyshev only affects instant MOVE (timed_movement = false).
timed_movement = true
# Haxe DebugSayPlayerPosition: LS "{world_x},{world_y}" at feet on MOVE (debug pathing).
# Keep false in play; set true to see server tiles without a debugger.
debug_say_player_position = false
move_jump_max_chebyshev = 2
intent_drain_budget = 64
ops_sample_every_ticks = 100
ops_flush_secs = 300
ops_journal_path = "SaveFiles/ops_metrics.journal"
# AI NPCs (Haxe NumberOfAis / MinNumberOfAis). Keep max small for local playtest latency.
npc_enabled = true
npc_min = 3
npc_max = 3
# Scheduler wakes every 200ms. Primary AI cadence is class reaction time (Haxe AiBase.time).
# ai_think_period_ticks remains as a legacy stagger/cleanup scale, not the main gate.
ai_think_period_ticks = 20
# Haxe AiReactionTime / Serf / Noble (seconds between full AI thinks).
# Commoner=0.5, Serf=0.7 (slower), Noble=0.2 (faster). Angry multiplies by factor.
ai_reaction_time = 0.5
ai_reaction_time_serf = 0.7
ai_reaction_time_noble = 0.2
ai_reaction_time_factor_if_angry = 0.2
ai_observe_radius = 16
ai_craft_radius = 50
# Always send PU/MX to all connected players (ignore distance).
# MUST stay false for playable latency — true floods humans with all AI traffic
# and delayed SAY/LS by tens of seconds to minutes.
broadcast_all_updates = false
# SAY !shutdown (godmode): global countdown, then save + AP apocalypse signal, then exit.
shutdown_countdown_secs = 3
shutdown_apocalypse_secs = 3

# --- CONFIG-SETTINGS (Haxe ServerSettings + TimeHelper.ReadServerSettings) ---
# Live-editable while the server runs. Every `settings_reload_every_ticks` sim ticks
# (~200 @ 20 Hz = 10s, same cadence as Haxe), the server checks whether this file's
# mtime changed and re-reads it if so (Haxe re-reads every beat; Rust skips when
# unchanged). Omitted keys use compiled Haxe defaults — same idea as Haxe lines
# prefixed `**default**` that readFromFile skips.
# Live-editable while server runs (mtime change + every settings_reload_every_ticks).
# Haxe EternalWinter — force Winter season while true.
eternal_winter = false
# Haxe SeasonDuration in years (1 year ≈ 60 real seconds). Default 7.5 → 450 s/season.
season_duration_years = 7.5
# Haxe TimeHelper.ReadServerSettings — re-read this file every N sim ticks.
settings_hot_reload = true
# Haxe tick % 200 == 0 cadence (@ 20 Hz ≈ 10 s).
settings_reload_every_ticks = 200

# --- LOCKPICK-SETTINGS (Haxe ServerSettings.Lockpick*) ---
# Live-editable. Used by Lock Removal Key 1003 mismatch → try_lockpick.
# Haxe LockpickSucessChance (typo Sucess) — success band percent of 0..100 roll.
lockpick_success_chance = 5.0
# Fail/break band from top of 0..100 roll (r > 100 - fail_chance → key breaks).
lockpick_fail_chance = 10.0
# Exhaustion added per attempt (female ×0.5 in pure try_lockpick).
lockpick_exhaustion_cost = 3.0
# Coins deducted per attempt.
lockpick_coin_cost = 1.0

