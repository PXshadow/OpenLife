[workspace]
resolver = "2"
members = [
    "crates/ol-protocol",
    "crates/ol-metrics",
    "crates/ol-config",
    "crates/ol-net",
    "crates/ol-web",
    "crates/ol-sim",
    "crates/ol-ai-api",
    "crates/ol-ai-crafting",
    "crates/ol-ai-helper",
    "crates/ol-ai-professions",
    "crates/ol-ai",
    "crates/ol-main-ai",
    "crates/ol-player-helper",
    "crates/ol-binary",
    "crates/ol-content",
    "crates/ol-world",
    "crates/ol-server",
]
default-members = ["crates/ol-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Open Life Reborn contributors"]
repository = ""
rust-version = "1.75"

[workspace.dependencies]
ol-protocol = { path = "crates/ol-protocol" }
ol-metrics = { path = "crates/ol-metrics" }
ol-config = { path = "crates/ol-config" }
ol-net = { path = "crates/ol-net" }
ol-web = { path = "crates/ol-web" }
ol-sim = { path = "crates/ol-sim" }
ol-ai-api = { path = "crates/ol-ai-api" }
ol-ai-crafting = { path = "crates/ol-ai-crafting" }
ol-ai-helper = { path = "crates/ol-ai-helper" }
ol-ai-professions = { path = "crates/ol-ai-professions" }
ol-ai = { path = "crates/ol-ai" }
ol-main-ai = { path = "crates/ol-main-ai" }
ol-player-helper = { path = "crates/ol-player-helper" }
ol-binary = { path = "crates/ol-binary" }
ol-content = { path = "crates/ol-content" }
ol-world = { path = "crates/ol-world" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }

# --- Build speed (dev / day-to-day) -------------------------------------------
# Local crates stay opt-level 0 for fast recompile of ol-sim/ol-server.
# Dependencies compile once at opt-level 2 (slower first build, much faster
# incremental + faster tests that exercise dep code).
# Linker: see .cargo/config.toml (rust-lld).
[profile.dev]
incremental = true
# Line tables only — much faster link than full debuginfo; stack traces OK.
debug = "line-tables-only"
# More parallel codegen units for large crates (ol-sim lib.rs ~1.5MB).
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2
debug = false

# Faster *running* of ol-sim's large build.rs patch suite (reads lib.rs many times).
[profile.dev.build-override]
opt-level = 2
debug = false

[profile.test]
# Match dev for test binaries (cargo test uses this + dev for deps).
incremental = true
debug = "line-tables-only"
codegen-units = 256

[profile.test.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
