[package]
name = "ohol-headless"
version = "0.1.0"
edition = "2024"
publish = false
description = "One Hour One Life / Open Life Rust client (headless + optional GPU)"
license = "LicenseRef-Proprietary"

[[bin]]
name = "ohol-headless"
path = "src/main.rs"

[[bin]]
name = "ohol-client"
path = "src/bin/ohol_client.rs"
required-features = ["gpu"]

[features]
## Default client: GPU present + real-device audio. Headless-only: `--no-default-features`.
default = ["gpu", "audio"]
## Windowed client: minifb soft path + winit/pixels GPU present. Runtime Soft mode turns GPU present off.
gpu = ["dep:minifb", "dep:winit", "dep:pixels"]
## Real-device sound playback (cpal). Runtime Settings → Audio / `OHOL_AUDIO_DISABLE` turns device off.
audio = ["dep:cpal"]

[dependencies]
## Shared OLC1/OLT1 binary loaders (client + server; zero-dep format crate).
ol-binary = { path = "../openlife/RustServer/crates/ol-binary" }
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
flate2 = "1"
minifb = { version = "0.27", optional = true }
## GPU present of the soft-FB (texture upload + hardware scale). Default graphics mode.
## Pin winit 0.28 to match pixels 0.13 (raw-window-handle 0.5).
winit = { version = "0.28", optional = true }
pixels = { version = "0.13", optional = true }
## One small crate for device output; only with `--features audio`.
cpal = { version = "0.15", optional = true }
## Pure-Rust OGG Vorbis decode for music beds (`music/music_NN.ogg`). Lazy on ensure/play only —
## boot index scan never calls lewton. Justified: only min pure-Rust Vorbis decoder; no C deps.
lewton = "0.10"

[dev-dependencies]
